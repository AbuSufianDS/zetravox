{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2 text-success"></i>Friend Requests</h4>
            </div>
            <div class="card-body">
                {% if requests %}
                    {% for req in requests %}
                    <div class="d-flex align-items-center justify-content-between p-3 border rounded-3 mb-2">
                        <div class="d-flex align-items-center gap-3">
                            <img src="{{ req.sender.avatar(50) }}" class="rounded-circle" style="width: 50px; height: 50px; object-fit: cover;">
                            <div>
                                <a href="{{ url_for('main.user', username=req.sender.username) }}" class="fw-semibold text-decoration-none">
                                    {{ req.sender.username }}
                                </a>
                                <div class="small text-muted">
                                    <i class="far fa-clock"></i> {{ moment(req.created_at).fromNow() }}
                                </div>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-success me-1" onclick="acceptRequest({{ req.id }})">
                                <i class="fas fa-check"></i> Accept
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="rejectRequest({{ req.id }})">
                                <i class="fas fa-times"></i> Reject
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="text-center py-5">
                        <i class="fas fa-envelope-open fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No pending friend requests</p>
                        <a href="{{ url_for('main.discover') }}" class="btn btn-outline-primary">
                            <i class="fas fa-search me-2"></i>Find Friends
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
function acceptRequest(requestId) {
    fetch(`/accept-friend-request/${requestId}`, {method: 'POST'})
        .then(() => location.reload());
}

function rejectRequest(requestId) {
    fetch(`/reject-friend-request/${requestId}`, {method: 'POST'})
        .then(() => location.reload());
}
</script>
{% endblock %}

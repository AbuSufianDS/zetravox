{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2 text-primary"></i>Connection Requests</h4>
            </div>
            <div class="card-body">
                {% if requests %}
                    {% for req in requests %}
                    <div class="d-flex align-items-center justify-content-between p-3 border rounded-3 mb-2">
                        <div class="d-flex align-items-center gap-3">
                            <img src="{{ req.from_user.avatar(50) }}" class="rounded-circle" style="width: 50px; height: 50px; object-fit: cover;">
                            <div>
                                <a href="{{ url_for('main.user', username=req.from_user.username) }}" class="fw-semibold text-decoration-none">
                                    {{ req.from_user.username }}
                                </a>
                                <div class="small text-muted">
                                    <i class="far fa-clock"></i> {{ moment(req.created_at).fromNow() }}
                                </div>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-success me-1" onclick="acceptRequest({{ req.id }})" id="acceptBtn{{ req.id }}">
                                <i class="fas fa-check"></i> Approve
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="rejectRequest({{ req.id }})" id="rejectBtn{{ req.id }}">
                                <i class="fas fa-times"></i> Decline
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="text-center py-5">
                        <i class="fas fa-envelope-open fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No pending connection requests</p>
                        <a href="{{ url_for('main.discover') }}" class="btn btn-outline-primary">
                            <i class="fas fa-search me-2"></i>Discover People
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
function acceptRequest(requestId) {
    const btn = document.getElementById(`acceptBtn${requestId}`);
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    fetch(`/accept-friend-request/${requestId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || ''
        }
    })
    .then(response => {
        if (response.ok) {
            location.reload();
        } else {
            alert('Unable to approve request');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Approve';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Connection error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Approve';
    });
}

function rejectRequest(requestId) {
    const btn = document.getElementById(`rejectBtn${requestId}`);
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    fetch(`/reject-friend-request/${requestId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || ''
        }
    })
    .then(response => {
        if (response.ok) {
            location.reload();
        } else {
            alert('Unable to decline request');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-times"></i> Decline';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Connection error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-times"></i> Decline';
    });
}
</script>
{% endblock %}

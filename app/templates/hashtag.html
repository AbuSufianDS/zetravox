{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">#{{ hashtag.name }}</h4>
                    <small>{{ hashtag.post_count }} posts</small>
                </div>
            </div>
            
            {% for post in posts %}
                {% include '_post.html' %}
            {% else %}
                <div class="card">
                    <div class="card-body text-center text-muted">
                        No posts found with this hashtag.
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}

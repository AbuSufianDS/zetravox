{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">🔥 Trending Hashtags</h4>
                </div>
                <div class="card-body">
                    {% if hashtags %}
                        <div class="list-group">
                            {% for hashtag in hashtags %}
                                <a href="{{ url_for('main.hashtag_posts', tag=hashtag.name) }}" 
                                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <span>#{{ hashtag.name }}</span>
                                    <span class="badge bg-primary rounded-pill">{{ hashtag.post_count }} posts</span>
                                </a>
                            {% endfor %}
                        </div>
                    {% else %}
                        <p class="text-center text-muted">No trending hashtags yet.</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

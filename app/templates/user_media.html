{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-white">
                    <h4><i class="fas fa-photo-video me-2 text-primary"></i>{{ user.username }}'s Gallery</h4>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        {% for media in media_items %}
                        <div class="col-md-3">
                            <div class="media-card">
                                {% if media.type == 'image' %}
                                <img src="{{ url_for('static', filename='uploads/posts/' + media.url) }}"
                                     class="img-fluid rounded media-thumb"
                                     style="width: 100%; height: 200px; object-fit: cover; cursor: pointer;"
                                     onclick="openMediaViewer('{{ url_for('static', filename='uploads/posts/' + media.url) }}', 'image')">
                                {% else %}
                                <video class="img-fluid rounded media-thumb"
                                       style="width: 100%; height: 200px; object-fit: cover; cursor: pointer;"
                                       onclick="this.paused ? this.play() : this.pause()">
                                    <source src="{{ url_for('static', filename='uploads/posts/' + media.url) }}" type="video/mp4">
                                </video>
                                {% endif %}
                                <div class="media-overlay">
                                    <small class="text-white">{{ moment(media.timestamp).fromNow() }}</small>
                                </div>
                            </div>
                        </div>
                        {% else %}
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-camera fa-3x text-muted mb-3"></i>
                            <p class="text-muted">No media uploaded yet</p>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.media-card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    cursor: pointer;
}
.media-thumb {
    transition: transform 0.3s ease;
}
.media-card:hover .media-thumb {
    transform: scale(1.05);
}
.media-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    padding: 30px 10px 10px;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.media-card:hover .media-overlay {
    opacity: 1;
}
</style>
{% endblock %}

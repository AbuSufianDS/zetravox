{% extends "base.html" %}

{% block content %}
<style>
.reset-container {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
}
.reset-card {
    background: var(--bg-card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 40px;
    max-width: 450px;
    width: 100%;
}
.password-strength {
    height: 4px;
    background: var(--border-color);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
}
.strength-bar {
    height: 100%;
    width: 0%;
    transition: width 0.3s;
}
.strength-weak { background: #e74c3c; width: 25%; }
.strength-fair { background: #f39c12; width: 50%; }
.strength-good { background: #3498db; width: 75%; }
.strength-strong { background: #2ecc71; width: 100%; }
</style>

<div class="reset-container">
    <div class="reset-card">
        <div class="text-center mb-4">
            <i class="fas fa-lock fa-3x" style="color: #667eea;"></i>
            <h3 class="mt-3">Create New Password</h3>
            <p class="text-muted">Choose a strong password for your account</p>
        </div>
        
        <form method="POST" id="resetForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-3">
                <label class="form-label fw-semibold">New Password</label>
                <input type="password" name="password" id="password" class="form-control-custom" required>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <small class="text-muted" id="strengthText"></small>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirmPassword" class="form-control-custom" required>
                <div id="matchMessage" class="small mt-1"></div>
            </div>
            
            <button type="submit" class="btn-gradient" id="submitBtn">
                <i class="fas fa-save me-2"></i>Reset Password
            </button>
        </form>
        
        <div class="back-link text-center mt-3">
            <a href="{{ url_for('auth.login') }}">← Back to Login</a>
        </div>
    </div>
</div>

<script>
const password = document.getElementById('password');
const confirmPassword = document.getElementById('confirmPassword');
const strengthBar = document.getElementById('strengthBar');
const strengthText = document.getElementById('strengthText');

function checkPasswordStrength(pwd) {
    let strength = 0;
    if (pwd.length >= 6) strength++;
    if (pwd.match(/[a-z]/) && pwd.match(/[A-Z]/)) strength++;
    if (pwd.match(/[0-9]/)) strength++;
    if (pwd.match(/[!@#$%^&*]/)) strength++;
    
    if (pwd.length === 0) {
        strengthBar.className = 'strength-bar';
        strengthText.innerHTML = '';
        return;
    }
    
    if (strength <= 1) {
        strengthBar.className = 'strength-bar strength-weak';
        strengthText.innerHTML = '<span class="text-danger">Weak password</span>';
    } else if (strength <= 2) {
        strengthBar.className = 'strength-bar strength-fair';
        strengthText.innerHTML = '<span class="text-warning">Fair password</span>';
    } else if (strength <= 3) {
        strengthBar.className = 'strength-bar strength-good';
        strengthText.innerHTML = '<span class="text-info">Good password</span>';
    } else {
        strengthBar.className = 'strength-bar strength-strong';
        strengthText.innerHTML = '<span class="text-success">Strong password</span>';
    }
}

function checkPasswordMatch() {
    if (confirmPassword.value.length === 0) {
        document.getElementById('matchMessage').innerHTML = '';
        return;
    }
    
    if (password.value === confirmPassword.value) {
        document.getElementById('matchMessage').innerHTML = '<i class="fas fa-check-circle text-success"></i> Passwords match';
    } else {
        document.getElementById('matchMessage').innerHTML = '<i class="fas fa-exclamation-circle text-danger"></i> Passwords do not match';
    }
}

password.addEventListener('input', function() {
    checkPasswordStrength(this.value);
    checkPasswordMatch();
});

confirmPassword.addEventListener('input', checkPasswordMatch);

document.getElementById('resetForm').addEventListener('submit', function(e) {
    if (password.value !== confirmPassword.value) {
        e.preventDefault();
        alert('Passwords do not match!');
    }
    
    if (password.value.length < 6) {
        e.preventDefault();
        alert('Password must be at least 6 characters!');
    }
});
</script>

<style>
.form-control-custom {
    border: 2px solid var(--border-color);
    border-radius: 14px;
    padding: 14px 18px;
    width: 100%;
    transition: all 0.2s;
    background: var(--bg-card);
    color: var(--text-primary);
}
.form-control-custom:focus {
    border-color: #667eea;
    outline: none;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.btn-gradient {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 14px;
    padding: 14px;
    color: white;
    font-weight: 600;
    width: 100%;
    transition: all 0.3s;
}
.btn-gradient:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
}
.back-link a {
    color: #667eea;
    text-decoration: none;
}
</style>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<style>
.verify-container {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* Animated Background */
.verify-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
    background-size: 200% 200%;
    animation: gradientShift 15s ease infinite;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating Orbs */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: floatOrb 20s ease-in-out infinite;
}

.orb-1 {
    width: 400px;
    height: 400px;
    background: rgba(102, 126, 234, 0.15);
    top: -150px;
    left: -150px;
}

.orb-2 {
    width: 350px;
    height: 350px;
    background: rgba(118, 75, 162, 0.15);
    bottom: -100px;
    right: -100px;
    animation-delay: 5s;
}

@keyframes floatOrb {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(30px, -30px); }
    66% { transform: translate(-20px, 20px); }
}

/* Verification Card */
.verify-card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(20px);
    border-radius: 48px;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255,255,255,0.2);
    padding: 48px 40px;
    max-width: 500px;
    width: 100%;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] .verify-card {
    background: rgba(36, 37, 38, 0.97);
}

.verify-card:hover {
    transform: translateY(-5px);
}

/* Icon Section */
.verify-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    animation: pulseGlow 2s infinite;
}

@keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
    50% { box-shadow: 0 0 0 15px rgba(102, 126, 234, 0); }
}

.verify-icon i {
    font-size: 36px;
    color: white;
}

.verify-card h3 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
}

.verify-card p {
    text-align: center;
    color: var(--text-secondary);
    margin-bottom: 8px;
}

.email-highlight {
    color: #667eea;
    font-weight: 600;
    background: rgba(102, 126, 234, 0.1);
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-block;
}

/* OTP Inputs */
.otp-input-group {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 32px 0;
}

.otp-input {
    width: 56px;
    height: 70px;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    border: 2px solid var(--border-color);
    border-radius: 20px;
    background: var(--bg-card);
    color: var(--text-primary);
    transition: all 0.3s;
}

.otp-input:focus {
    border-color: #667eea;
    outline: none;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
    transform: scale(1.02);
}

/* Timer */
.timer-text {
    text-align: center;
    padding: 12px;
    background: rgba(239, 68, 68, 0.1);
    border-radius: 40px;
    color: #ef4444;
    font-size: 14px;
    font-weight: 600;
    margin: 20px 0;
}

.timer-text i {
    margin-right: 8px;
}

.btn-verify {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 40px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}

.btn-verify::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
}

.btn-verify:hover::before {
    left: 100%;
}

.btn-verify:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

/* Links */
.resend-link {
    text-align: center;
    margin-top: 24px;
}

.resend-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s;
}

.resend-link a:hover {
    text-decoration: underline;
}

.back-link {
    text-align: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
}

.back-link a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
}

.back-link a:hover {
    color: #667eea;
}

@media (max-width: 560px) {
    .verify-card {
        padding: 32px 24px;
        margin: 20px;
    }

    .otp-input {
        width: 45px;
        height: 55px;
        font-size: 22px;
    }

    .otp-input-group {
        gap: 8px;
    }

    .verify-card h3 {
        font-size: 22px;
    }
}
</style>

<div class="verify-container">
    <div class="verify-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="verify-card">
        <div class="verify-icon">
            <i class="fas fa-envelope-open-text"></i>
        </div>

        <h3>Verify Your Identity</h3>
        <p>We've sent a 6-digit verification code to</p>
        <p class="email-highlight"><i class="fas fa-envelope me-2"></i>{{ email }}</p>

        <form method="POST" id="otpForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="otp_code" id="otpCode">

            <div class="otp-input-group">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" oninput="moveToNext(this, 0)">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" oninput="moveToNext(this, 1)">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" oninput="moveToNext(this, 2)">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" oninput="moveToNext(this, 3)">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" oninput="moveToNext(this, 4)">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" oninput="moveToNext(this, 5)">
            </div>

            <div class="timer-text" id="timer">
                <i class="fas fa-clock"></i> Code expires in <span id="timerMinutes">10</span>:<span id="timerSeconds">00</span>
            </div>

            <button type="submit" class="btn-verify">
                <i class="fas fa-check-circle me-2"></i> Verify Code
            </button>
        </form>

        <div class="resend-link">
            <a href="#" onclick="resendCode(event)">
                <i class="fas fa-redo-alt me-1"></i> Didn't receive code? Resend
            </a>
        </div>

        <div class="back-link">
            <a href="{{ url_for('auth.forgot_password') }}">
                <i class="fas fa-arrow-left me-2"></i> Back
            </a>
        </div>
    </div>
</div>

<script>
let timerInterval;
let timeLeft = 600; // 10 minutes in seconds

function startTimer() {
    timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('timer').innerHTML = '<i class="fas fa-exclamation-circle me-2"></i> Code expired. Please request a new one.';
            document.getElementById('timer').style.background = 'rgba(239, 68, 68, 0.2)';
        } else {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerMinutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('timerSeconds').textContent = seconds.toString().padStart(2, '0');
            timeLeft--;
        }
    }, 1000);
}

function moveToNext(input, index) {
    input.value = input.value.replace(/[^0-9]/g, '');

    if (input.value.length === 1) {
        const nextInput = document.querySelectorAll('.otp-input')[index + 1];
        if (nextInput) {
            nextInput.focus();
        } else {
            // Auto-submit when all digits are entered
            const allInputs = document.querySelectorAll('.otp-input');
            let otp = '';
            allInputs.forEach(inp => otp += inp.value);
            if (otp.length === 6) {
                document.getElementById('otpCode').value = otp;
                document.getElementById('otpForm').submit();
            }
        }
    }
}

document.querySelectorAll('.otp-input').forEach((input, index) => {
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && input.value === '' && index > 0) {
            const prevInput = document.querySelectorAll('.otp-input')[index - 1];
            prevInput.focus();
        }
    });
});

function resendCode(event) {
    event.preventDefault();

    fetch('/auth/resend-otp', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('input[name="csrf_token"]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            clearInterval(timerInterval);
            timeLeft = 600;
            startTimer();

            document.querySelectorAll('.otp-input').forEach(inp => inp.value = '');
            document.querySelectorAll('.otp-input')[0].focus();

            const timerDiv = document.getElementById('timer');
            timerDiv.style.background = 'rgba(16, 185, 129, 0.1)';
            timerDiv.style.color = '#10b981';
            timerDiv.innerHTML = '<i class="fas fa-check-circle me-2"></i> New code sent to your email!';
            setTimeout(() => {
                timerDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                timerDiv.style.color = '#ef4444';
            }, 3000);
        } else {
            alert('Failed to resend OTP. Please try again.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Failed to resend OTP. Please try again.');
    });
}

const otpContainer = document.querySelector('.otp-input-group');
if (otpContainer) {
    otpContainer.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text');
        if (pastedData.length === 6 && /^\d+$/.test(pastedData)) {
            const inputs = document.querySelectorAll('.otp-input');
            for (let i = 0; i < 6; i++) {
                inputs[i].value = pastedData[i];
            }
            document.getElementById('otpCode').value = pastedData;
            document.getElementById('otpForm').submit();
        }
    });
}

startTimer();
</script>
{% endblock %}

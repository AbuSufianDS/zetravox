{% extends "base.html" %}

{% block content %}
<style>
.notifications-premium {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.notif-hero {
    background: linear-gradient(135deg, #667eea08, #764ba208);
    border-radius: 32px;
    padding: 32px;
    text-align: center;
    margin-bottom: 30px;
    border: 1px solid rgba(102,126,234,0.1);
}

.notif-hero-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    animation: ring 2s infinite;
}

@keyframes ring {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(10deg); }
    75% { transform: rotate(-10deg); }
}

.notif-hero-icon i {
    font-size: 32px;
    color: white;
}

.notif-hero h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}

.notif-hero p {
    color: var(--text-secondary);
}

.notif-card {
    background: var(--bg-card);
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}

.notif-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.notif-header h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
}

.mark-all-btn {
    background: none;
    border: none;
    color: #667eea;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
}

.mark-all-btn:hover {
    text-decoration: underline;
}

.notif-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    transition: all 0.3s;
    cursor: pointer;
    text-decoration: none;
}

.notif-item:hover {
    background: var(--hover-bg);
    transform: translateX(5px);
}

.notif-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.notif-icon.like { background: #ef444420; color: #ef4444; }
.notif-icon.comment { background: #3b82f620; color: #3b82f6; }
.notif-icon.follow { background: #10b98120; color: #10b981; }
.notif-icon.share { background: #8b5cf620; color: #8b5cf6; }
.notif-icon.friend { background: #f59e0b20; color: #f59e0b; }

.notif-content {
    flex: 1;
}

.notif-message {
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 4px;
}

.notif-time {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
}

.notif-dot {
    width: 8px;
    height: 8px;
    background: #667eea;
    border-radius: 50%;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
}

.empty-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, #667eea10, #764ba210);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.empty-icon i {
    font-size: 48px;
    color: #667eea;
}

.empty-state h4 {
    font-size: 20px;
    margin-bottom: 8px;
}

@media (max-width: 768px) {
    .notifications-premium { padding: 12px; }
    .notif-hero { padding: 24px; }
    .notif-hero h1 { font-size: 22px; }
}
</style>

<div class="notifications-premium">

    <div class="notif-hero">
        <div class="notif-hero-icon">
            <i class="fas fa-bell"></i>
        </div>
        <h1>Activity</h1>
        <p>Stay updated with what's happening</p>
    </div>

    <div class="notif-card">
        <div class="notif-header">
            <h3><i class="fas fa-clock me-2"></i>Recent Activity</h3>
            <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
        </div>

        <div id="notifications-list">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="text-muted mt-2">Loading activity...</p>
            </div>
        </div>
    </div>
</div>

<script>
function formatTime(timestamp) {
    const date = new Date(timestamp * 1000);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} days ago`;
    return date.toLocaleDateString();
}

function getNotificationIcon(type) {
    const icons = {
        'like': '<i class="fas fa-heart"></i>',
        'comment': '<i class="fas fa-comment"></i>',
        'follow': '<i class="fas fa-user-plus"></i>',
        'share': '<i class="fas fa-share-alt"></i>',
        'friend_request': '<i class="fas fa-user-friends"></i>',
        'friend_accepted': '<i class="fas fa-check-circle"></i>'
    };
    return icons[type] || '<i class="fas fa-bell"></i>';
}

function getNotificationClass(type) {
    const classes = {
        'like': 'like',
        'comment': 'comment',
        'follow': 'follow',
        'share': 'share',
        'friend_request': 'friend',
        'friend_accepted': 'friend'
    };
    return classes[type] || 'like';
}

function getNotificationLink(notif) {
    if (notif.name === 'like' || notif.name === 'comment' || notif.name === 'share') {
        return `/post/${notif.post_id}`;
    } else if (notif.name === 'follow') {
        return `/user/${notif.from_user}`;
    } else if (notif.name === 'friend_request') {
        return '/friend-requests';
    } else if (notif.name === 'friend_accepted') {
        return '/friends';
    }
    return '#';
}

function getNotificationMessage(notif) {
    switch(notif.name) {
        case 'like': return `<strong>${escapeHtml(notif.from_user)}</strong> liked your post`;
        case 'comment': return `<strong>${escapeHtml(notif.from_user)}</strong> commented: "${escapeHtml(notif.comment?.substring(0, 60))}"`;
        case 'follow': return `<strong>${escapeHtml(notif.from_user)}</strong> started following you`;
        case 'share': return `<strong>${escapeHtml(notif.from_user)}</strong> shared your post`;
        case 'friend_request': return `<strong>${escapeHtml(notif.from_user)}</strong> wants to connect`;
        case 'friend_accepted': return `<strong>${escapeHtml(notif.from_user)}</strong> accepted your request`;
        default: return escapeHtml(notif.message || 'You have new activity');
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function loadNotifications() {
    fetch('/notifications-list')
        .then(response => response.json())
        .then(notifications => {
            const container = document.getElementById('notifications-list');

            if (!notifications || notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-bell-slash"></i>
                        </div>
                        <h4>No activity yet</h4>
                        <p class="text-muted">When someone interacts with you, it will appear here</p>
                    </div>
                `;
                return;
            }

            let html = '';
            notifications.forEach(notif => {
                const iconClass = getNotificationClass(notif.name);
                const iconHtml = getNotificationIcon(notif.name);
                const message = getNotificationMessage(notif);
                const link = getNotificationLink(notif);
                const time = formatTime(notif.timestamp);

                html += `
                    <a href="${link}" class="notif-item" onclick="markAsRead(${notif.id})">
                        <div class="notif-icon ${iconClass}">
                            ${iconHtml}
                        </div>
                        <div class="notif-content">
                            <div class="notif-message">${message}</div>
                            <div class="notif-time">
                                <i class="far fa-clock"></i> ${time}
                                <span class="notif-dot"></span>
                            </div>
                        </div>
                    </a>
                `;
            });
            container.innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('notifications-list').innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <p class="text-muted">Unable to load activity</p>
                    <button class="btn btn-primary btn-sm" onclick="loadNotifications()">Try Again</button>
                </div>
            `;
        });
}

function markAsRead(notifId) {
    fetch(`/api/notifications/${notifId}/mark-read`, {
        method: 'POST',
        headers: { 'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || '' }
    }).catch(error => console.error('Error:', error));
}

function markAllRead() {
    fetch('/api/notifications/mark-read', {
        method: 'POST',
        headers: { 'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || '' }
    }).then(() => loadNotifications());
}

function updateBadge() {
    fetch('/notifications')
        .then(response => response.json())
        .then(data => {
            const badge = document.getElementById('notification-count');
            if (badge && data.count > 0) {
                badge.style.display = 'inline-block';
                badge.innerText = data.count > 99 ? '99+' : data.count;
            }
        });
}

loadNotifications();
updateBadge();
</script>
{% endblock %}

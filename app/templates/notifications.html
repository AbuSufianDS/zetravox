{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-bell me-2 text-primary"></i>Activity</h4>
                </div>
                <div class="card-body p-0">
                    <div id="notifications-list" class="list-group list-group-flush">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="text-muted mt-2">Loading activity...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function formatTime(timestamp) {
    const date = new Date(timestamp * 1000);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);

    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff / 60)} minutes ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} days ago`;
    return date.toLocaleDateString();
}

function getNotificationHTML(notif) {
    let icon = '';
    let message = '';
    let link = '#';

    if (notif.name === 'like') {
        icon = '<i class="fas fa-heart text-danger fa-fw"></i>';
        message = `${notif.from_user} applauded your post`;
        link = `/post/${notif.post_id}`;
    } else if (notif.name === 'comment') {
        icon = '<i class="fas fa-comment text-primary fa-fw"></i>';
        const reply = notif.comment.substring(0, 50);
        message = `${notif.from_user} replied: "${reply}${notif.comment.length > 50 ? '...' : ''}"`;
        link = `/post/${notif.post_id}`;
    } else if (notif.name === 'follow') {
        icon = '<i class="fas fa-user-plus text-success fa-fw"></i>';
        message = `${notif.from_user} started following you`;
        link = `/user/${notif.from_user}`;
    } else if (notif.name === 'share') {
        icon = '<i class="fas fa-share text-info fa-fw"></i>';
        message = `${notif.from_user} reposted your content`;
        link = `/post/${notif.post_id}`;
    } else if (notif.name === 'friend_request') {
        icon = '<i class="fas fa-user-plus text-primary fa-fw"></i>';
        message = `${notif.from_user} wants to connect with you`;
        link = `/friend-requests`;
    } else if (notif.name === 'friend_accepted') {
        icon = '<i class="fas fa-check-circle text-success fa-fw"></i>';
        message = `${notif.from_user} accepted your connection request`;
        link = `/friends`;
    } else {
        icon = '<i class="fas fa-bell text-secondary fa-fw"></i>';
        message = notif.message || 'You have new activity';
    }

    return `
        <a href="${link}" class="list-group-item list-group-item-action" style="text-decoration: none;">
            <div class="d-flex align-items-start gap-3">
                <div class="flex-shrink-0">${icon}</div>
                <div class="flex-grow-1">
                    <p class="mb-1">${message}</p>
                    <small class="text-muted">${formatTime(notif.timestamp)}</small>
                </div>
            </div>
        </a>
    `;
}

function loadNotifications() {
    fetch('/notifications-list')
        .then(response => response.json())
        .then(notifications => {
            const container = document.getElementById('notifications-list');

            if (!notifications || notifications.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-bell-slash fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No activity yet</p>
                        <small class="text-muted">When someone interacts with you, you'll see it here</small>
                    </div>
                `;
                return;
            }

            let html = '';
            notifications.forEach(notif => {
                html += getNotificationHTML(notif);
            });
            container.innerHTML = html;
        })
        .catch(error => {
            console.error('Error loading activity:', error);
            document.getElementById('notifications-list').innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <p class="text-muted">Unable to load activity</p>
                    <button class="btn btn-primary btn-sm" onclick="loadNotifications()">
                        <i class="fas fa-sync me-2"></i>Try Again
                    </button>
                </div>
            `;
        });
}

const badge = document.getElementById('notification-count');
if (badge) {
    badge.style.display = 'none';
    badge.innerText = '0';
}

loadNotifications();
</script>
{% endblock %}

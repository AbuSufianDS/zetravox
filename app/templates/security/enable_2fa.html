{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="fas fa-mobile-alt me-2 text-primary"></i>Enable Two-Factor Authentication</h5>
                </div>
                <div class="card-body text-center">
                    <p>Scan this QR code with your authenticator app:</p>
                    <img src="data:image/png;base64,{{ qr_code }}" class="img-fluid border p-3 rounded mb-3" style="max-width: 250px;">
                    
                    <p class="small text-muted">Or enter this code manually:</p>
                    <code class="bg-light p-2 rounded d-inline-block mb-3">{{ secret }}</code>
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Verification Code</label>
                            <input type="text" name="otp_code" class="form-control text-center" placeholder="000000" pattern="[0-9]{6}" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify and Enable</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

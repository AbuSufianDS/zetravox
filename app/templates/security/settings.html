{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <img src="{{ current_user.avatar(80) }}" class="rounded-circle mb-3" style="width: 80px; height: 80px;">
                        <h5>{{ current_user.username }}</h5>
                        <p class="text-muted small">{{ current_user.email }}</p>
                    </div>
                    <hr>
                    <div class="list-group list-group-flush">
    <a href="{{ url_for('security.account_settings') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-user fa-fw" style="width: 24px;"></i>
        <span>Account</span>
    </a>
    <a href="{{ url_for('security.security_settings') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-shield-alt fa-fw text-success" style="width: 24px;"></i>
        <span>Security</span>
    </a>
    <a href="{{ url_for('security.privacy_settings') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-lock fa-fw text-warning" style="width: 24px;"></i>
        <span>Privacy</span>
    </a>
    <a href="{{ url_for('security.appearance_settings') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-palette fa-fw text-info" style="width: 24px;"></i>
        <span>Appearance</span>
    </a>
    <a href="{{ url_for('security.notification_settings') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-bell fa-fw text-secondary" style="width: 24px;"></i>
        <span>Notifications</span>
    </a>
    <a href="{{ url_for('security.screen_protection') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-mobile-alt fa-fw text-secondary" style="width: 24px;"></i>
        <span>Screen Protection</span>
    </a>
    <a href="{{ url_for('security.session_management') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-desktop fa-fw text-secondary" style="width: 24px;"></i>
        <span>Sessions</span>
    </a>
    <a href="{{ url_for('security.login_history') }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <i class="fas fa-history fa-fw text-secondary" style="width: 24px;"></i>
        <span>Login History</span>
    </a>
</div>
                </div>
            </div>
        </div>
        
        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <i class="fas fa-cog fa-3x text-muted mb-3"></i>
                    <h4>Settings</h4>
                    <p class="text-muted">Select a category from the left menu</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

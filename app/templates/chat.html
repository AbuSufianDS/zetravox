{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
    <div class="card">
        <div class="card-header">
            <h5>💬 Chat with {{ other_user.username }}</h5>
            <a href="{{ url_for('main.conversations') }}" class="btn btn-sm btn-secondary">← Back</a>
        </div>
        <div class="card-body" id="chatMessages" style="height: 400px; overflow-y: auto;">
            {% for msg in messages %}
                <div class="mb-2 {% if msg.sender_id == current_user.id %}text-end{% endif %}">
                    <div class="d-inline-block p-2 rounded {% if msg.sender_id == current_user.id %}bg-primary text-white{% else %}bg-light{% endif %}">
                        <strong>{{ msg.sender.username if msg.sender_id != current_user.id else 'You' }}:</strong>
                        {{ msg.message }}
                        <br>
                        <small class="{% if msg.sender_id == current_user.id %}text-white-50{% else %}text-muted{% endif %}">
                            {{ moment(msg.timestamp).fromNow() }}
                        </small>
                    </div>
                </div>
            {% endfor %}
        </div>
        <div class="card-footer">
            <form id="messageForm">
                <input type="hidden" id="recipient_id" value="{{ other_user.id }}">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type a message..." required>
                    <button type="submit" class="btn btn-primary">Send</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const messageForm = document.getElementById('messageForm');
const messageInput = document.getElementById('messageInput');
const recipientId = document.getElementById('recipient_id').value;

function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

scrollToBottom();

messageForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = messageInput.value.trim();
    if (!message) return;
    
    const response = await fetch('/send_message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ recipient_id: recipientId, message: message })
    });
    
    if (response.ok) {
        messageInput.value = '';
        fetchMessages();
    }
});

async function fetchMessages() {
    const since = document.querySelectorAll('.chat-message-time').length > 0 
        ? document.querySelector('.chat-message-time:last-child')?.dataset?.timestamp || 0 
        : 0;
    
    const response = await fetch(`/get_messages/${recipientId}?since=${since}`);
    const messages = await response.json();
    
    for (const msg of messages) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `mb-2 ${msg.is_mine ? 'text-end' : ''}`;
        msgDiv.innerHTML = `
            <div class="d-inline-block p-2 rounded ${msg.is_mine ? 'bg-primary text-white' : 'bg-light'}">
                <strong>${msg.is_mine ? 'You' : '{{ other_user.username }}'}:</strong>
                ${msg.message}
                <br>
                <small class="${msg.is_mine ? 'text-white-50' : 'text-muted'} chat-message-time" data-timestamp="${msg.timestamp}">
                    ${new Date(msg.timestamp * 1000).toLocaleTimeString()}
                </small>
            </div>
        `;
        chatMessages.appendChild(msgDiv);
    }
    scrollToBottom();
}

setInterval(fetchMessages, 3000);
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<style>
.events-premium {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.events-header {
    background: linear-gradient(135deg, #3b82f608, #2563eb08);
    border-radius: 32px;
    padding: 32px;
    text-align: center;
    margin-bottom: 30px;
}

.events-header-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
}

.events-header-icon i {
    font-size: 40px;
    color: white;
}

.events-header h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.event-card {
    background: var(--bg-card);
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    margin-bottom: 20px;
    transition: all 0.3s;
}

.event-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--premium-shadow-hover);
    border-color: #3b82f6;
}

.event-date {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    padding: 16px;
    text-align: center;
    color: white;
}

.create-event-btn {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 40px;
    font-weight: 600;
    width: 100%;
    margin-top: 20px;
}

@media (max-width: 768px) {
    .events-premium { padding: 12px; }
}
</style>

<div class="events-premium">

    <div class="events-header">
        <div class="events-header-icon">
            <i class="fas fa-calendar-alt"></i>
        </div>
        <h1>Happenings</h1>
        <p class="text-muted">Discover events in your network</p>
    </div>

    <div class="event-card">
        <div class="event-date">
            <div class="small">COMING SOON</div>
            <div class="h3 mb-0">Event Discovery</div>
        </div>
        <div class="p-4 text-center">
            <i class="fas fa-calendar-plus fa-3x text-muted mb-3"></i>
            <h5>Events Feature Coming Soon!</h5>
            <p class="text-muted">Find and RSVP to events happening in your area</p>
            <div class="mt-3">
                <div class="progress mb-2" style="height: 6px;">
                    <div class="progress-bar bg-primary" style="width: 70%"></div>
                </div>
                <small class="text-muted">Launching in Q2 2024</small>
            </div>
        </div>
    </div>

    <button class="create-event-btn" disabled>
        <i class="fas fa-plus me-2"></i> Create Event (Coming Soon)
    </button>
</div>
{% endblock %}

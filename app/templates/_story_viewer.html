<div id="storyViewerModal" class="story-viewer-modal" style="display: none;">
    <div class="story-viewer-overlay">
        <div class="story-viewer-container">
            <button class="story-close-btn" onclick="closeStoryViewer()">
                <i class="fas fa-times"></i>
            </button>

                <div class="story-viewer-main" id="storyViewerMain">
                    <img id="storyImage" class="story-media" style="display: none;">
                    <video id="storyVideo" class="story-media" controls style="display: none;"></video>
                    <div id="storyTextContent" class="story-text-container" style="display: none;">
                        <div class="story-text-content">
                            <div class="story-author-info">
                                <img id="storyTextAvatar" class="rounded-circle" style="width: 48px; height: 48px;">
                                <div>
                                    <div id="storyTextAuthor" class="fw-bold text-white"></div>
                                    <div id="storyTextTime" class="small text-white-50"></div>
                                </div>
                            </div>
                            <div id="storyTextBody" class="story-text-body"></div>
                            <div id="storyOriginalPost" class="story-original-post mt-3" style="display: none;">
                                <a id="storyOriginalPostLink" href="#" class="text-white text-decoration-none">
                                    <i class="fas fa-eye me-2"></i>View Original Post
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="story-viewer-sidebar">
                    <div class="story-info">
                        <img id="storyAuthorAvatar" class="story-author-avatar">
                        <div class="story-author-details">
                            <strong id="storyAuthorName"></strong>
                            <small id="storyTime"></small>
                        </div>
                    </div>
                    <div class="story-caption" id="storyCaption"></div>
                    <div class="story-reactions">
                        <div class="reaction-container story-reaction-container">
                            <button class="story-react-btn" id="storyReactBtn">
                                <i class="far fa-smile"></i> React
                            </button>
                            <div class="reaction-picker story-reaction-picker">
                                <button class="reaction-option" onclick="reactToMoment(currentStoryId, 'like')">
                                    <span class="reaction-emoji">👍</span>
                                    <span class="reaction-label">Applaud</span>
                                </button>
                                <button class="reaction-option" onclick="reactToMoment(currentStoryId, 'love')">
                                    <span class="reaction-emoji">❤️</span>
                                    <span class="reaction-label">Love</span>
                                </button>
                                <button class="reaction-option" onclick="reactToMoment(currentStoryId, 'haha')">
                                    <span class="reaction-emoji">😂</span>
                                    <span class="reaction-label">Funny</span>
                                </button>
                                <button class="reaction-option" onclick="reactToMoment(currentStoryId, 'wow')">
                                    <span class="reaction-emoji">😮</span>
                                    <span class="reaction-label">Amazing</span>
                                </button>
                                <button class="reaction-option" onclick="reactToMoment(currentStoryId, 'sad')">
                                    <span class="reaction-emoji">😢</span>
                                    <span class="reaction-label">Sad</span>
                                </button>
                                <button class="reaction-option" onclick="reactToMoment(currentStoryId, 'angry')">
                                    <span class="reaction-emoji">😠</span>
                                    <span class="reaction-label">Angry</span>
                                </button>
                            </div>
                        </div>
                        <div class="story-reaction-count" id="storyReactionCount">0</div>
                    </div>
                    <div class="story-comments-section">
                        <div class="story-comments-list">
                            <div class="story-comments-header">
                                <i class="fas fa-comment-dots"></i> Replies
                            </div>
                            <div id="storyComments"></div>
                        </div>
                        <div class="story-comment-input">
                            <input type="text" id="storyCommentInput" placeholder="Send a reply..." class="story-comment-field">
                            <button onclick="sendMomentComment(currentStoryId)" class="story-comment-send">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="story-nav-prev" onclick="prevStory()">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="story-nav-next" onclick="nextStory()">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
let currentStoryIndex = 0;
let currentStories = [];
let currentStoryId = null;

function openMomentViewer(storyId) {
    fetch(`/story-data/${storyId}`)
        .then(response => response.json())
        .then(story => {
            currentStories = [story];
            currentStoryIndex = 0;
            currentStoryId = story.id;
            document.getElementById('storyViewerModal').style.display = 'flex';
            loadMoment(currentStoryIndex);
        });
}

function loadMoment(index) {
    const story = currentStories[index];
    if (!story) return;
    currentStoryId = story.id;

    const imgEl = document.getElementById('storyImage');
    const videoEl = document.getElementById('storyVideo');
    const textEl = document.getElementById('storyTextContent');

    imgEl.style.display = 'none';
    videoEl.style.display = 'none';
    textEl.style.display = 'none';

    if (story.media_type === 'image') {
        imgEl.src = `/static/uploads/stories/${story.media_url}`;
        imgEl.style.display = 'block';
    } else if (story.media_type === 'video') {
        videoEl.src = `/static/uploads/stories/${story.media_url}`;
        videoEl.style.display = 'block';
    } else if (story.media_type === 'text') {
        textEl.style.display = 'flex';
        textEl.style.background = story.bg_color ? getGradientBackground(story.bg_color) : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        document.getElementById('storyTextAvatar').src = story.author_avatar;
        document.getElementById('storyTextAuthor').innerHTML = story.author_name;
        document.getElementById('storyTextTime').innerHTML = story.time_ago;
        document.getElementById('storyTextBody').innerHTML = story.caption.replace(/\n/g, '<br>');

        if (story.shared_post_id) {
            document.getElementById('storyOriginalPost').style.display = 'block';
            document.getElementById('storyOriginalPostLink').href = `/post/${story.shared_post_id}`;
        } else {
            document.getElementById('storyOriginalPost').style.display = 'none';
        }
    }

    document.getElementById('storyAuthorAvatar').src = story.author_avatar;
    document.getElementById('storyAuthorName').innerHTML = story.author_name;
    document.getElementById('storyTime').innerHTML = story.time_ago;
    document.getElementById('storyCaption').innerHTML = story.caption || '';
    document.getElementById('storyReactionCount').innerHTML = story.reaction_count || 0;
    loadMomentComments(story.id);
}

function getGradientBackground(bgColor) {
    const gradients = {
        'gradient-purple': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
        'gradient-pink': 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
        'gradient-blue': 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        'gradient-green': 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
        'gradient-orange': 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
        'gradient-dark': 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)'
    };
    return gradients[bgColor] || gradients['gradient-purple'];
}

function prevStory() {
    if (currentStoryIndex > 0) {
        currentStoryIndex--;
        loadMoment(currentStoryIndex);
    }
}

function nextStory() {
    if (currentStoryIndex < currentStories.length - 1) {
        currentStoryIndex++;
        loadMoment(currentStoryIndex);
    }
}

function closeStoryViewer() {
    document.getElementById('storyViewerModal').style.display = 'none';
}

function reactToMoment(storyId, reaction) {
    fetch(`/react_story/${storyId}/${reaction}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('storyReactionCount').innerHTML = data.reaction_count;
        }
    });
}

function loadMomentComments(storyId) {
    fetch(`/get_story_comments/${storyId}`)
        .then(response => response.json())
        .then(comments => {
            const container = document.getElementById('storyComments');
            if (!comments || comments.length === 0) {
                container.innerHTML = '<div class="no-comments">No replies yet. Send a message!</div>';
                return;
            }
            container.innerHTML = comments.map(c => `
                <div class="story-comment">
                    <img src="${c.author_avatar}" class="story-comment-avatar">
                    <div class="story-comment-bubble">
                        <strong class="story-comment-author">${escapeHtml(c.author_name)}</strong>
                        <p class="story-comment-text">${escapeHtml(c.message)}</p>
                        <small class="story-comment-time">${c.time_ago}</small>
                    </div>
                </div>
            `).join('');
        });
}

function sendMomentComment(storyId) {
    const input = document.getElementById('storyCommentInput');
    const message = input.value.trim();
    if (!message) return;
    fetch('/send_story_comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story_id: storyId, message: message })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            input.value = '';
            loadMomentComments(storyId);
        }
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('storyViewerModal');
    if (modal && modal.style.display === 'flex') {
        if (e.key === 'ArrowLeft') prevStory();
        if (e.key === 'ArrowRight') nextStory();
        if (e.key === 'Escape') closeStoryViewer();
    }
});
</script>

<script>
// ========== STORY VIEWER JAVASCRIPT ==========

let currentStoryIndex = 0;
let currentStories = [];
let currentStoryId = null;
let progressInterval = null;

// ===== OPEN VIEWER =====
function openMomentViewer(stories, index) {
    if (typeof stories === 'number') {
        fetch(`/story-data/${stories}`)
            .then(response => response.json())
            .then(story => {
                currentStories = [story];
                currentStoryIndex = 0;
                currentStoryId = story.id;
                document.getElementById('storyViewerModal').style.display = 'flex';
                loadStory(currentStoryIndex);
            })
            .catch(error => {
                console.error('Error loading story:', error);
                alert('Could not load story');
            });
        return;
    }

    if (!stories || stories.length === 0) return;
    currentStories = stories;
    currentStoryIndex = index || 0;
    currentStoryId = currentStories[currentStoryIndex].id;
    document.getElementById('storyViewerModal').style.display = 'flex';
    loadStory(currentStoryIndex);
}

// ===== LOAD STORY =====
function loadStory(index) {
    const story = currentStories[index];
    if (!story) return;
    currentStoryId = story.id;

    if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
    }

    const imgEl = document.getElementById('storyImage');
    const videoEl = document.getElementById('storyVideo');
    const textEl = document.getElementById('storyTextContent');
    const mainEl = document.getElementById('storyViewerMain');

    imgEl.style.display = 'none';
    videoEl.style.display = 'none';
    textEl.style.display = 'none';

    let mediaUrl = story.media_url || '';
    if (mediaUrl && !mediaUrl.startsWith('/') && !mediaUrl.startsWith('http')) {
        mediaUrl = '/static/uploads/stories/' + mediaUrl;
    }

    const mediaType = story.media_type || 'image';

    if (mediaType === 'image' && mediaUrl) {
        imgEl.src = mediaUrl;
        imgEl.style.display = 'block';
        startProgress();
    } else if (mediaType === 'video' && mediaUrl) {
        videoEl.src = mediaUrl;
        videoEl.style.display = 'block';
        videoEl.load();
        videoEl.onplay = function() { startProgress(); };
        videoEl.onended = function() { nextStory(); };
    } else {
        textEl.style.display = 'flex';
        textEl.style.background = story.bg_color || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        document.getElementById('storyTextAvatar').src = story.author_avatar || '';
        document.getElementById('storyTextAuthor').textContent = story.author_name || 'Unknown';
        document.getElementById('storyTextTime').textContent = story.time_ago || 'Just now';
        document.getElementById('storyTextBody').textContent = story.caption || 'No content';
        startProgress();
    }

    document.getElementById('storySidebarAvatar').src = story.author_avatar || '';
    document.getElementById('storySidebarName').textContent = story.author_name || 'Unknown';
    document.getElementById('storySidebarTime').textContent = story.time_ago || 'Just now';
    document.getElementById('storySidebarCaption').textContent = story.caption || '';
    document.getElementById('storyReactionCount').textContent = story.reaction_count || 0;

    document.getElementById('storyUserAvatar').src = story.author_avatar || '';
    document.getElementById('storyUserName').textContent = story.author_name || 'Unknown';
    document.getElementById('storyUserTime').textContent = story.time_ago || 'Just now';

    loadStoryComments(story.id);
    document.getElementById('storyProgressBar').style.width = '0%';
}

// ===== PROGRESS BAR =====
function startProgress() {
    if (progressInterval) clearInterval(progressInterval);
    let progress = 0;
    const bar = document.getElementById('storyProgressBar');

    progressInterval = setInterval(() => {
        progress += 0.5;
        bar.style.width = Math.min(progress, 100) + '%';
        if (progress >= 100) {
            clearInterval(progressInterval);
            progressInterval = null;
            setTimeout(() => {
                if (currentStoryIndex < currentStories.length - 1) {
                    nextStory();
                }
            }, 500);
        }
    }, 50);
}

// ===== NAVIGATION =====
function prevStory() {
    if (currentStoryIndex > 0) {
        currentStoryIndex--;
        loadStory(currentStoryIndex);
    }
}

function nextStory() {
    if (currentStoryIndex < currentStories.length - 1) {
        currentStoryIndex++;
        loadStory(currentStoryIndex);
    }
}

function closeStoryViewer() {
    document.getElementById('storyViewerModal').style.display = 'none';
    if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
    }
    const video = document.getElementById('storyVideo');
    if (video) video.pause();
    closeAllStoryDropdowns();
}

// ===== THREE DOTS DROPDOWN =====
function toggleStoryDropdown() {
    const menu = document.getElementById('storyDropdownMenu');
    const overlay = document.getElementById('storyDropdownOverlay');

    document.querySelectorAll('.story-dropdown-menu').forEach(m => {
        if (m !== menu) m.classList.remove('show');
    });

    menu.classList.toggle('show');

    if (!overlay) {
        const newOverlay = document.createElement('div');
        newOverlay.id = 'storyDropdownOverlay';
        newOverlay.className = 'story-dropdown-overlay';
        newOverlay.onclick = function() {
            closeAllStoryDropdowns();
        };
        document.body.appendChild(newOverlay);
    }

    const overlayEl = document.getElementById('storyDropdownOverlay');
    if (menu.classList.contains('show')) {
        overlayEl.classList.add('show');
    } else {
        overlayEl.classList.remove('show');
    }
}

function closeAllStoryDropdowns() {
    document.querySelectorAll('.story-dropdown-menu').forEach(m => {
        m.classList.remove('show');
    });
    const overlay = document.getElementById('storyDropdownOverlay');
    if (overlay) overlay.classList.remove('show');
}

// ===== DROPDOWN ACTIONS =====
function shareStory() {
    const story = currentStories[currentStoryIndex];
    if (!story) return;

    const shareUrl = window.location.origin + '/view_story/' + story.id;

    if (navigator.share) {
        navigator.share({
            title: 'Check out this story on Zetravox',
            text: story.caption || 'Check out this story!',
            url: shareUrl
        }).catch(() => {});
    } else {
        navigator.clipboard.writeText(shareUrl).then(() => {
            showToast('Link copied to clipboard!', 'success');
        }).catch(() => {
            prompt('Copy this link to share:', shareUrl);
        });
    }
    closeAllStoryDropdowns();
}

function saveStory() {
    const story = currentStories[currentStoryIndex];
    if (!story) return;

    fetch('/save_story/' + story.id, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || ''
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showToast('Story saved!', 'success');
        } else {
            showToast('Failed to save story', 'error');
        }
    })
    .catch(() => {
        showToast('Failed to save story', 'error');
    });
    closeAllStoryDropdowns();
}

function copyStoryLink() {
    const story = currentStories[currentStoryIndex];
    if (!story) return;

    const link = window.location.origin + '/view_story/' + story.id;
    navigator.clipboard.writeText(link).then(() => {
        showToast('Link copied to clipboard!', 'success');
    }).catch(() => {
        prompt('Copy this link:', link);
    });
    closeAllStoryDropdowns();
}

function viewUserProfile() {
    const story = currentStories[currentStoryIndex];
    if (!story) return;

    const username = story.author_name || 'user';
    window.location.href = '/user/' + username;
}

function reportStory() {
    const story = currentStories[currentStoryIndex];
    if (!story) return;

    if (confirm('Are you sure you want to report this story?')) {
        fetch('/report_story/' + story.id, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || ''
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('Story reported. We will review it.', 'success');
            } else {
                showToast('Failed to report story', 'error');
            }
        })
        .catch(() => {
            showToast('Failed to report story', 'error');
        });
    }
    closeAllStoryDropdowns();
}

function showToast(message, type = 'success') {
    const existing = document.querySelector('.story-toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'story-toast ' + type;
    toast.innerHTML = `
        <div class="story-toast-icon">
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
        </div>
        <span>${message}</span>
    `;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.classList.add('show');
    }, 100);

    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ===== REACTIONS =====
function toggleReactionPicker() {
    const picker = document.getElementById('storyReactionPicker');
    picker.classList.toggle('show');
}

function reactToStory(storyId, reaction) {
    fetch(`/react_story/${storyId}/${reaction}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('storyReactionCount').textContent = data.reaction_count || 0;
            document.getElementById('storyReactionPicker').classList.remove('show');
        }
    })
    .catch(error => console.error('Error:', error));
}

// ===== COMMENTS =====
function loadStoryComments(storyId) {
    fetch(`/get_story_comments/${storyId}`)
        .then(response => response.json())
        .then(comments => {
            const container = document.getElementById('storyCommentsList');
            if (!comments || comments.length === 0) {
                container.innerHTML = '<div class="story-no-comments">No replies yet</div>';
                return;
            }
            container.innerHTML = comments.map(c => `
                <div class="story-comment-item">
                    <img src="${c.author_avatar}" class="story-comment-avatar">
                    <div class="story-comment-bubble">
                        <div class="story-comment-author">${escapeHtml(c.author_name)}</div>
                        <div class="story-comment-text">${escapeHtml(c.message)}</div>
                        <span class="story-comment-time">${c.time_ago}</span>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        })
        .catch(error => console.error('Error loading comments:', error));
}

function sendStoryComment(storyId) {
    const input = document.getElementById('storyCommentInput');
    const message = input.value.trim();
    if (!message) return;

    fetch('/send_story_comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story_id: storyId, message: message })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            input.value = '';
            loadStoryComments(storyId);
        }
    })
    .catch(error => console.error('Error:', error));
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('storyViewerModal');
    if (modal && modal.style.display === 'flex') {
        // Arrow Left - Previous Story
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevStory();
        }
        // Arrow Right - Next Story
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextStory();
        }
        // Escape - Close Viewer and Dropdowns
        if (e.key === 'Escape') {
            e.preventDefault();
            closeStoryViewer();
            closeAllStoryDropdowns();
        }
        // Space - Pause/Resume video (optional)
        if (e.key === ' ') {
            e.preventDefault();
            const video = document.getElementById('storyVideo');
            if (video && video.style.display !== 'none') {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        }
    }
});

// ===== CLOSE ON CLICK OUTSIDE =====
document.addEventListener('click', function(e) {
    const modal = document.getElementById('storyViewerModal');
    if (modal && modal.style.display === 'flex') {
        if (e.target === modal) {
            closeStoryViewer();
        }
    }
});

// ===== CLOSE DROPDOWN ON CLICK OUTSIDE =====
document.addEventListener('click', function(e) {
    const dropdownContainer = document.querySelector('.story-dropdown-container');
    const dropdownMenu = document.getElementById('storyDropdownMenu');
    const overlay = document.getElementById('storyDropdownOverlay');

    if (dropdownContainer && dropdownMenu) {
        if (!dropdownContainer.contains(e.target)) {
            dropdownMenu.classList.remove('show');
            if (overlay) overlay.classList.remove('show');
        }
    }
});
</script>

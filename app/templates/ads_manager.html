{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="fas fa-chart-line me-2 text-primary"></i>Promotions Hub</h4>
                <small class="text-muted">Manage your promotional campaigns</small>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card bg-light">
                            <div class="card-body text-center py-4">
                                <i class="fas fa-chart-simple fa-3x text-primary mb-3"></i>
                                <h5>Campaign Performance</h5>
                                <p class="small text-muted">Track your promotion metrics</p>
                                <button class="btn btn-primary btn-sm" disabled>Coming Soon</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card bg-light">
                            <div class="card-body text-center py-4">
                                <i class="fas fa-plus-circle fa-3x text-success mb-3"></i>
                                <h5>Create New Campaign</h5>
                                <p class="small text-muted">Start promoting your content</p>
                                <button class="btn btn-primary btn-sm" disabled>Coming Soon</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="alert alert-info text-center">
                    <i class="fas fa-info-circle me-2"></i>
                    Promotions Hub is currently in development. Stay tuned for updates!
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

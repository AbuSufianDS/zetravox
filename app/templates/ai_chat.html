{% extends "base.html" %}

{% block content %}

<style>
.ai-chat-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.ai-chat-card {
    background: var(--bg-card);
    border-radius: 32px;
    border: 1px solid rgba(102,126,234,0.12);
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
}

.chat-header-premium {
    padding: 28px 32px;
    background: linear-gradient(135deg, #667eea05, #764ba205);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 18px;
}

.ai-avatar-premium {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(102,126,234,0.2);
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.ai-avatar-premium i {
    font-size: 30px;
    color: white;
}

.ai-info-premium {
    flex: 1;
}

.ai-info-premium h2 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #10b98115;
    color: #10b981;
    padding: 5px 14px;
    border-radius: 40px;
    font-size: 12px;
    font-weight: 500;
}

.status-badge i {
    font-size: 8px;
}

.ai-info-premium p {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 6px 0 0;
}

/* ─── Chat Messages ─── */
.chat-messages-premium {
    height: 520px;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.chat-messages-premium::-webkit-scrollbar {
    width: 5px;
}

.chat-messages-premium::-webkit-scrollbar-track {
    background: var(--hover-bg);
    border-radius: 10px;
}

.chat-messages-premium::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 10px;
}

.message-premium {
    display: flex;
    gap: 14px;
    animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message-user {
    justify-content: flex-end;
}

.message-ai {
    justify-content: flex-start;
}

.message-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.message-user .message-avatar {
    background: linear-gradient(135deg, #667eea, #764ba2);
    order: 2;
    box-shadow: 0 4px 12px rgba(102,126,234,0.3);
}

.message-ai .message-avatar {
    background: #f0f2f5;
    color: #667eea;
}

[data-theme="dark"] .message-ai .message-avatar {
    background: #3a3b3c;
}

.message-avatar i {
    font-size: 17px;
}

.message-bubble {
    max-width: 70%;
    padding: 14px 20px;
    border-radius: 24px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.message-user .message-bubble {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 15px rgba(102,126,234,0.25);
}

.message-ai .message-bubble {
    background: var(--hover-bg);
    color: var(--text-primary);
    border-bottom-left-radius: 6px;
    border: 1px solid var(--border-color);
}

.message-time {
    font-size: 10px;
    margin-top: 8px;
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 6px;
}

.message-user .message-time {
    justify-content: flex-end;
}

/* ─── Chat Input ─── */
.chat-input-premium {
    padding: 20px 28px 28px;
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 14px;
    align-items: flex-end;
    background: var(--bg-card);
}

.chat-input-wrapper {
    flex: 1;
    position: relative;
}

.chat-input-premium textarea {
    width: 100%;
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: 28px;
    padding: 14px 20px;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    max-height: 120px;
    transition: all 0.2s;
}

.chat-input-premium textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}

.chat-input-premium textarea:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.send-btn-premium {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(102,126,234,0.3);
}

.send-btn-premium:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(102,126,234,0.4);
}

.send-btn-premium:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* ─── Typing Indicator ─── */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--hover-bg);
    border-radius: 28px;
    width: fit-content;
    border: 1px solid var(--border-color);
}

.typing-dots {
    display: flex;
    gap: 5px;
}

.typing-dots span {
    width: 8px;
    height: 8px;
    background: #667eea;
    border-radius: 50%;
    animation: typingWave 1.4s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingWave {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-10px); opacity: 1; }
}

/* ─── Empty State ─── */
.empty-chat-premium {
    text-align: center;
    padding: 70px 30px;
}

.empty-icon-premium {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #667eea10, #764ba210);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
}

.empty-icon-premium i {
    font-size: 42px;
    color: #667eea;
}

.empty-chat-premium h3 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.empty-chat-premium p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 0;
}

.suggestion-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 28px;
}

.suggestion-btn {
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: 40px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
}

.suggestion-btn:hover {
    border-color: #667eea;
    background: #667eea08;
    transform: translateY(-2px);
}

.suggestion-btn:active {
    transform: translateY(0);
}

/* ─── Responsive ─── */
@media (max-width: 768px) {
    .ai-chat-container { padding: 12px; }
    .chat-header-premium { padding: 20px; }
    .chat-messages-premium { padding: 16px; height: 420px; }
    .message-bubble { max-width: 85%; padding: 10px 16px; }
    .suggestion-buttons { gap: 8px; }
    .suggestion-btn { padding: 7px 14px; font-size: 12px; }
    .empty-chat-premium { padding: 40px 20px; }
    .chat-input-premium { padding: 16px 16px 20px; }
}

@media (max-width: 480px) {
    .ai-info-premium h2 {
        font-size: 18px;
    }
    .status-badge {
        font-size: 10px;
        padding: 3px 10px;
    }
}
</style>

<div class="ai-chat-container">
    <div class="ai-chat-card">

        <!-- ─── Header ─── -->
        <div class="chat-header-premium">
            <div class="ai-avatar-premium">
                <i class="fas fa-robot"></i>
            </div>
            <div class="ai-info-premium">
                <h2>
                    Zetravox AI Assistant
                    <span class="status-badge">
                        <i class="fas fa-circle"></i> Ready
                    </span>
                </h2>
                <p>Powered by advanced AI • Ask me anything about Zetravox</p>
            </div>
        </div>

        <!-- ─── Chat Messages ─── -->
        <div class="chat-messages-premium" id="chatMessages">
            <div class="empty-chat-premium">
                <div class="empty-icon-premium">
                    <i class="fas fa-robot"></i>
                </div>
                <h3>Hello, I'm Zetravox AI</h3>
                <p>Your intelligent assistant for everything Zetravox</p>
                <div class="suggestion-buttons">
                    <button class="suggestion-btn" onclick="sendSuggestion('How do I create a post?')">📝 Create post</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('How to connect with friends?')">👥 Find friends</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Privacy settings guide')">🔒 Privacy</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Tips to grow my network')">📈 Grow network</button>
                </div>
            </div>
        </div>

        <!-- ─── Chat Input ─── -->
        <div class="chat-input-premium">
            <div class="chat-input-wrapper">
                <textarea id="chatInput" placeholder="Ask me anything..." rows="1"></textarea>
            </div>
            <button class="send-btn-premium" id="sendBtn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </div>
</div>

<script>
let isWaitingForResponse = false;

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();

    if (!message || isWaitingForResponse) return;

    input.value = '';
    input.style.height = 'auto';

    addMessage('user', message);
    showTypingIndicator();
    isWaitingForResponse = true;

    try {
        const response = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('input[name="csrf_token"]')?.value || ''
            },
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        hideTypingIndicator();

        if (data.success) {
            addMessage('ai', data.reply);
        } else {
            addMessage('ai', data.error || 'I encountered an issue. Please try again in a moment.');
        }
    } catch (error) {
        hideTypingIndicator();
        addMessage('ai', 'Network connection issue. Please check your internet and try again.');
    } finally {
        isWaitingForResponse = false;
    }
}

// ─── Helper Functions ──────────────────────────────────────────
function addMessage(role, content) {
    const container = document.getElementById('chatMessages');
    const emptyState = container.querySelector('.empty-chat-premium');
    if (emptyState) emptyState.remove();

    const messageDiv = document.createElement('div');
    messageDiv.className = `message-premium message-${role}`;

    const avatarIcon = role === 'user' ? 'fa-user' : 'fa-robot';
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    messageDiv.innerHTML = `
        <div class="message-avatar">
            <i class="fas ${avatarIcon}"></i>
        </div>
        <div class="message-bubble">
            <div>${formatMessage(content)}</div>
            <div class="message-time">
                <i class="far fa-clock"></i> ${time}
            </div>
        </div>
    `;

    container.appendChild(messageDiv);
    messageDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function formatMessage(content) {
    return content
        .replace(/\n/g, '<br>')
        .replace(/`(.*?)`/g, '<code style="background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 6px; font-family: monospace;">$1</code>');
}

function showTypingIndicator() {
    const container = document.getElementById('chatMessages');
    const typingDiv = document.createElement('div');
    typingDiv.id = 'typingIndicator';
    typingDiv.className = 'message-premium message-ai';
    typingDiv.innerHTML = `
        <div class="message-avatar">
            <i class="fas fa-robot"></i>
        </div>
        <div class="typing-indicator">
            <span>AI is thinking</span>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    `;
    container.appendChild(typingDiv);
    typingDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function hideTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

function sendSuggestion(suggestion) {
    document.getElementById('chatInput').value = suggestion;
    sendMessage();
}

// ─── Event Listeners ──────────────────────────────────────────
const textarea = document.getElementById('chatInput');
if (textarea) {
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
}

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (textarea) textarea.focus();
    }
});
</script>

{% endblock %}

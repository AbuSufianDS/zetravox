{% extends "base.html" %}

{% block content %}
<style>
.ai-chat-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.ai-chat-card {
    background: var(--bg-card);
    border-radius: 28px;
    border: 1px solid rgba(102,126,234,0.1);
    overflow: hidden;
    box-shadow: var(--shadow);
}

.chat-header-premium {
    padding: 24px;
    background: linear-gradient(135deg, #667eea05, #764ba205);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 16px;
}

.ai-avatar-premium {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ai-avatar-premium i {
    font-size: 28px;
    color: white;
}

.ai-info-premium h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
}

.ai-info-premium p {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 4px 0 0;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #10b98120;
    color: #10b981;
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 11px;
    margin-left: 10px;
}

.chat-messages-premium {
    height: 500px;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.message-premium {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message-user {
    justify-content: flex-end;
}

.message-ai {
    justify-content: flex-start;
}

.message-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.message-user .message-avatar {
    background: linear-gradient(135deg, #667eea, #764ba2);
    order: 2;
}

.message-ai .message-avatar {
    background: #10b98120;
    color: #10b981;
}

.message-avatar i {
    font-size: 16px;
}

.message-bubble {
    max-width: 70%;
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.5;
}

.message-user .message-bubble {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-bottom-right-radius: 6px;
}

.message-ai .message-bubble {
    background: var(--hover-bg);
    color: var(--text-primary);
    border-bottom-left-radius: 6px;
    border: 1px solid var(--border-color);
}

.message-time {
    font-size: 10px;
    margin-top: 6px;
    opacity: 0.6;
}

.chat-input-premium {
    padding: 20px 24px;
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 12px;
    align-items: flex-end;
}

.chat-input-premium textarea {
    flex: 1;
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 12px 18px;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    max-height: 120px;
}

.chat-input-premium textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}

.send-btn-premium {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    transition: all 0.3s;
}

.send-btn-premium:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
}

/* Typing Indicator */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--hover-bg);
    border-radius: 24px;
    width: fit-content;
}

.typing-dots {
    display: flex;
    gap: 4px;
}

.typing-dots span {
    width: 8px;
    height: 8px;
    background: #667eea;
    border-radius: 50%;
    animation: typing 1.4s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-10px); opacity: 1; }
}

.empty-chat-premium {
    text-align: center;
    padding: 60px 20px;
}

.empty-icon-premium {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #667eea10, #764ba210);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.empty-icon-premium i {
    font-size: 36px;
    color: #667eea;
}

.empty-chat-premium h3 {
    font-size: 20px;
    margin-bottom: 8px;
}

.empty-chat-premium p {
    color: var(--text-secondary);
    font-size: 13px;
}

.suggestion-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 24px;
}

.suggestion-btn {
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: 40px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.suggestion-btn:hover {
    border-color: #667eea;
    background: #667eea10;
}

@media (max-width: 768px) {
    .ai-chat-container { padding: 12px; }
    .message-bubble { max-width: 85%; }
    .chat-messages-premium { height: 400px; }
}
</style>

<div class="ai-chat-container">
    <div class="ai-chat-card">

        <div class="chat-header-premium">
            <div class="ai-avatar-premium">
                <i class="fas fa-robot"></i>
            </div>
            <div class="ai-info-premium">
                <h2>
                    Zetravox AI Assistant
                    <span class="status-badge">
                        <i class="fas fa-circle" style="font-size: 8px;"></i> Ready
                    </span>
                </h2>
                <p>Your intelligent companion • Ask me anything about Zetravox</p>
            </div>
        </div>

        <div class="chat-messages-premium" id="chatMessages">
            <div class="empty-chat-premium">
                <div class="empty-icon-premium">
                    <i class="fas fa-robot"></i>
                </div>
                <h3>Hello! I'm Zetravox AI</h3>
                <p>Ask me anything about Zetravox or get help with:</p>
                <div class="suggestion-buttons">
                    <button class="suggestion-btn" onclick="sendSuggestion('How do I create a post?')">📝 Creating posts</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('How to connect with friends?')">👥 Finding friends</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Privacy settings guide')">🔒 Privacy settings</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Tips for growing my network')">📈 Growing network</button>
                </div>
            </div>
        </div>

        <div class="chat-input-premium">
            <textarea id="chatInput" placeholder="Ask me anything..." rows="1"></textarea>
            <button class="send-btn-premium" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </div>
</div>

<script>
let isTyping = false;
let conversationHistory = [];

// Send message
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();

    if (!message) return;

    // Clear input
    input.value = '';
    input.style.height = 'auto';

    // Add user message
    addMessage('user', message);

    // Show typing indicator
    showTypingIndicator();

    // Simulate AI response (Replace with actual API when you have key)
    setTimeout(() => {
        hideTypingIndicator();

        let response = getAIResponse(message);
        addMessage('ai', response);

        // Save to history
        conversationHistory.push({ role: 'user', content: message });
        conversationHistory.push({ role: 'assistant', content: response });
    }, 1500);
}

// Get AI response (simulated - replace with real API)
function getAIResponse(message) {
    const msg = message.toLowerCase();

    if (msg.includes('post') || msg.includes('create')) {
        return "To create a post on Zetravox:\n\n1. Click the 'Create Post' button at the top of your feed\n2. Write your thoughts in the text area\n3. Add photos or videos (optional)\n4. Choose privacy settings (Public, Followers, or Only Me)\n5. Click 'Publish' to share with your network!\n\nYou can also schedule posts for later by using the schedule option.";
    }
    else if (msg.includes('connect') || msg.includes('friend')) {
        return "To connect with friends on Zetravox:\n\n1. Visit someone's profile by clicking their username\n2. Click the 'Connect' button on their profile\n3. Or go to 'Discover' page to find new people\n4. You can also accept connection requests from the 'Requests' icon in the navbar\n\nOnce connected, you'll see their posts in your feed and can send private messages!";
    }
    else if (msg.includes('privacy')) {
        return "Privacy settings on Zetravox:\n\n1. Go to Settings > Privacy\n2. You can control:\n   • Who can see your posts (Public, Followers, Only Me)\n   • Who can send you friend requests\n   • Who can message you\n   • Whether your profile appears in search\n3. You can also block users from your profile page\n\nYour privacy is our priority!";
    }
    else if (msg.includes('grow') || msg.includes('network')) {
        return "Tips to grow your Zetravox network:\n\n1. Post regularly - Share interesting content\n2. Engage with others - Like and comment on posts\n3. Use relevant hashtags to reach更多人\n4. Share your profile link on other platforms\n5. Participate in discussions and groups\n6. Be authentic and consistent!\n\nThe more you engage, the more your network will grow!";
    }
    else if (msg.includes('message') || msg.includes('chat')) {
        return "To send private messages on Zetravox:\n\n1. Go to the Messages icon in the navbar\n2. Click on any conversation to open it\n3. Type your message in the chat box\n4. You can also send images and emojis\n5. Real-time notifications for new messages\n\nStart a conversation with your connections today!";
    }
    else if (msg.includes('profile') || msg.includes('edit')) {
        return "To edit your profile:\n\n1. Click on your avatar in the top right\n2. Select 'Edit Profile' from the dropdown\n3. You can update:\n   • Profile picture and cover photo\n   • Bio and personal information\n   • Work and education details\n   • Location and contact info\n4. Click 'Save Changes' when done\n\nMake your profile stand out!";
    }
    else {
        return "Thanks for your question! I'm Zetravox AI. I can help you with:\n\n• Creating and managing posts\n• Connecting with friends\n• Privacy and security settings\n• Growing your network\n• Using messages and chat\n• Editing your profile\n\nWhat would you like to know more about?";
    }
}

// Add message to chat
function addMessage(role, content) {
    const container = document.getElementById('chatMessages');

    // Remove empty state if present
    if (container.querySelector('.empty-chat-premium')) {
        container.innerHTML = '';
    }

    const messageDiv = document.createElement('div');
    messageDiv.className = `message-premium message-${role}`;
    messageDiv.innerHTML = `
        <div class="message-avatar">
            <i class="fas ${role === 'user' ? 'fa-user' : 'fa-robot'}"></i>
        </div>
        <div class="message-bubble">
            <div>${formatMessage(content)}</div>
            <div class="message-time">${getCurrentTime()}</div>
        </div>
    `;
    container.appendChild(messageDiv);

    // Scroll to bottom
    container.scrollTop = container.scrollHeight;
}

// Show typing indicator
function showTypingIndicator() {
    const container = document.getElementById('chatMessages');
    const typingDiv = document.createElement('div');
    typingDiv.id = 'typingIndicator';
    typingDiv.className = 'message-premium message-ai';
    typingDiv.innerHTML = `
        <div class="message-avatar">
            <i class="fas fa-robot"></i>
        </div>
        <div class="typing-indicator">
            <span>AI is thinking</span>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    `;
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;
}

// Hide typing indicator
function hideTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

// Send suggestion
function sendSuggestion(suggestion) {
    document.getElementById('chatInput').value = suggestion;
    sendMessage();
}

// Format message (handle line breaks)
function formatMessage(content) {
    return content.replace(/\n/g, '<br>');
}

// Get current time
function getCurrentTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Auto-resize textarea
const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Send on Enter (Shift+Enter for new line)
chatInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// Keyboard shortcut (Ctrl+K to focus chat)
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        chatInput.focus();
    }
});
</script>
{% endblock %}

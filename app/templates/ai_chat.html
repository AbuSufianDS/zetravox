{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-robot me-2"></i>AI Assistant
                        <small class="text-white-50">Powered by DeepSeek</small>
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Post Composer -->
                    <div class="mb-4 p-3 bg-light rounded">
                        <h5><i class="fas fa-magic me-2"></i>AI Post Composer</h5>
                        <div class="row">
                            <div class="col-md-8">
                                <input type="text" id="post-topic" class="form-control mb-2"
                                       placeholder="What's your post about? (e.g., Python coding, morning coffee)">
                            </div>
                            <div class="col-md-4">
                                <select id="post-tone" class="form-select mb-2">
                                    <option value="casual">Casual 😊</option>
                                    <option value="professional">Professional 💼</option>
                                    <option value="funny">Funny 😂</option>
                                    <option value="inspirational">Inspirational 🌟</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100" onclick="generatePost()" id="generate-btn">
                            <i class="fas fa-magic me-2"></i>Generate Post
                        </button>
                        <div id="post-result" class="mt-3" style="display: none;">
                            <label class="form-label">Generated Post:</label>
                            <textarea id="generated-post" class="form-control" rows="3" readonly></textarea>
                            <button class="btn btn-success btn-sm mt-2" onclick="usePost()">
                                <i class="fas fa-check me-1"></i>Use This Post
                            </button>
                        </div>
                    </div>

                    <!-- AI Chat -->
                    <div class="p-3 bg-light rounded">
                        <h5><i class="fas fa-comments me-2"></i>Chat with AI</h5>
                        <div id="chat-messages" style="height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: white; margin-bottom: 10px;">
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-robot fa-3x mb-2"></i>
                                <p>Ask me anything about writing, ideas, or just chat!</p>
                            </div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="chat-input" class="form-control"
                                   placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
                            <button class="btn btn-primary" onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i> Send
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let isGenerating = false;

function generatePost() {
    const topic = document.getElementById('post-topic').value;
    const tone = document.getElementById('post-tone').value;

    if (!topic) {
        alert('Please enter a topic for your post');
        return;
    }

    if (isGenerating) return;
    isGenerating = true;

    const btn = document.getElementById('generate-btn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Generating...';
    btn.disabled = true;

    fetch('/ai/generate-post', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({topic: topic, tone: tone})
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById('generated-post').value = data.post;
        document.getElementById('post-result').style.display = 'block';
    })
    .catch(error => {
        alert('Error generating post: ' + error);
    })
    .finally(() => {
        isGenerating = false;
        btn.innerHTML = '<i class="fas fa-magic me-2"></i>Generate Post';
        btn.disabled = false;
    });
}

function usePost() {
    const postText = document.getElementById('generated-post').value;
    const mainPostInput = document.querySelector('#post');
    if (mainPostInput) {
        mainPostInput.value = postText;
        alert('Post copied to your status box! You can now edit and submit it.');
        // Close modal if in modal
        const modal = document.querySelector('.modal');
        if (modal) {
            bootstrap.Modal.getInstance(modal)?.hide();
        }
    } else {
        navigator.clipboard.writeText(postText);
        alert('Post copied to clipboard! Paste it in the status box.');
    }
}

function sendMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();

    if (!message) return;

    // Add user message
    addMessage('user', message);
    input.value = '';

    // Show typing indicator
    showTypingIndicator();

    fetch('/ai/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams({message: message})
    })
    .then(response => response.json())
    .then(data => {
        removeTypingIndicator();
        addMessage('ai', data.response);
    })
    .catch(error => {
        removeTypingIndicator();
        addMessage('ai', 'Sorry, I encountered an error. Please try again.');
    });
}

function addMessage(sender, text) {
    const container = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `d-flex mb-2 ${sender === 'user' ? 'justify-content-end' : 'justify-content-start'}`;

    messageDiv.innerHTML = `
        <div class="p-2 rounded ${sender === 'user' ? 'bg-primary text-white' : 'bg-light'}" style="max-width: 70%;">
            <small class="text-${sender === 'user' ? 'white-50' : 'muted'}">${sender === 'user' ? 'You' : 'AI'}</small>
            <p class="mb-0">${escapeHtml(text)}</p>
        </div>
    `;

    container.appendChild(messageDiv);
    container.scrollTop = container.scrollHeight;

    // Remove welcome message if present
    const welcome = container.querySelector('.text-center');
    if (welcome && welcome.classList.contains('text-center')) {
        welcome.remove();
    }
}

function showTypingIndicator() {
    const container = document.getElementById('chat-messages');
    const typingDiv = document.createElement('div');
    typingDiv.id = 'typing-indicator';
    typingDiv.className = 'd-flex mb-2 justify-content-start';
    typingDiv.innerHTML = `
        <div class="bg-light p-2 rounded">
            <em>AI is typing...</em>
        </div>
    `;
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-mobile-alt me-2 text-primary"></i>Two-Factor Authentication</h4>
                </div>
                <div class="card-body">
                    <p>Please enter the verification code from your authenticator app.</p>
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Verification Code</label>
                            <input type="text" name="otp_code" class="form-control" placeholder="000000" autocomplete="off" pattern="[0-9]{6}">
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label class="form-label">Or use a backup code</label>
                            <input type="text" name="backup_code" class="form-control" placeholder="Enter backup code">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

services:
  - type: web
    name: connecthub
    env: python
    buildCommand: |
      pip install -r requirements_render.txt
      echo "Build complete"
    startCommand: gunicorn microblog_render:app --workers 1 --threads 1 --timeout 120 --max-requests 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: connecthub_db
          property: connectionString
      - key: SPAM_DETECTION_DISABLED
        value: true
      - key: RENDER
        value: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
    plan: free

databases:
  - name: connecthub_db
    plan: free